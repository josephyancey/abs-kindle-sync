# Audiobookshelf Sync: keeps the abs-sync service running from boot.
# Installed to /etc/upstart by the "Audiobookshelf Sync" library item.
description "Audiobookshelf Sync"

start on started lab126_gui
stop on (stopping lab126_gui or ota-update)

export LANG LC_ALL

respawn
respawn limit 5 300
normal exit 0

script
	SRC=/mnt/us/abs-sync/bin/abs-sync
	# Runs from internal storage: USB drive mode unmounts /mnt/us, which kills a binary running from it
	BIN=/var/local/abs-sync/abs-sync
	export ABS_SYNC_DIR=/mnt/us/abs-sync
	# abs-sync exits when USB drive mode starts; wait for the drive to come back
	until mountpoint -q /mnt/us && [ "$(lipc-get-prop com.lab126.volumd driveModeState 2>/dev/null)" = 0 ]; do
		lipc-wait-event -s 60 com.lab126.volumd userstoreAvailable >/dev/null 2>&1 || sleep 2
	done
	# Removed from the Kindle: nothing to run
	[ -x "$SRC" ] || exit 0
	if ! cmp -s "$SRC" "$BIN"; then
		mkdir -p "${BIN%/*}" && cp "$SRC" "$BIN.new" && mv "$BIN.new" "$BIN" || BIN=$SRC
	fi
	# Lower priority than the reader, and the first to go if memory runs out (upstart restarts it)
	echo 800 > /proc/self/oom_score_adj
	exec nice -n 10 "$BIN" run >/dev/null 2>&1
end script
